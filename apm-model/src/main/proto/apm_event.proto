//
// APM 事件 Protobuf 定义。
// 服务端使用此 .proto 文件反序列化客户端上报的二进制数据。
// 客户端使用零依赖的 ProtobufSerializer 直接写入 wire format，
// 保证与此定义完全兼容。

syntax = "proto3";

package com.apm.model;

option java_package = "com.apm.model";
option java_outer_classname = "ApmEventProto";

// APM 事件。
// 所有模块通过此消息格式上报性能数据。
message ApmEventMessage {
  // 事件时间戳（毫秒 epoch）。
  int64 timestamp = 1;

  // 模块名，如 "memory"、"crash"。
  string module = 2;

  // 事件名，如 "memory_snapshot"、"java_crash"。
  string name = 3;

  // 事件类型枚举名：METRIC / ALERT / FILE。
  string kind = 4;

  // 严重级别枚举名：DEBUG / INFO / WARN / ERROR / FATAL。
  string severity = 5;

  // 产生事件的进程名。
  string process_name = 6;

  // 产生事件的线程名。
  string thread_name = 7;

  // 当前场景（如 Activity 类名）。
  string scene = 8;

  // 是否前台。
  bool foreground = 9;

  // 事件指标数据。值为字符串表示（Any?.toString()）。
  map<string, string> fields = 10;

  // 全局上下文（默认 + 业务上下文合并）。
  map<string, string> global_context = 11;

  // 附加键值对。
  map<string, string> extras = 12;

  // 上传优先级枚举名：LOW / NORMAL / HIGH / CRITICAL。
  // 与 Line Protocol 输出保持同一套字段语义。
  string priority = 13;

  // Stable opaque client identity used by collectors for deduplication.
  string event_id = 14;

  // Versioned-envelope typed fields. Legacy field 10 remains for old standalone messages only.
  map<string, ApmTypedValue> typed_fields = 15;

  // Schema V3 occurrence-bound release, installation, and optional native identity.
  // V2 messages MUST NOT set this field.
  ApmOccurrenceContext occurrence = 16;
}

// Explicit scalar value used by schema version 2; `value` is absent only for NULL.
message ApmTypedValue {
  // Stable discriminator: NULL/STRING/BOOLEAN/BYTE/SHORT/INT/LONG/FLOAT/DOUBLE/CHAR/BIG_INTEGER/BIG_DECIMAL.
  string type = 1;

  // Canonical text preserving the discriminator-specific value.
  string value = 2;
}

// Standard resource shared by every event in a batch.
message ApmResource {
  string service_name = 1;
  string service_version = 2;
  string deployment_environment = 3;
  string installation_id = 4;
}

// Identity frozen into the durable event before an outbox write.
message ApmOccurrenceContext {
  string service_version = 1;
  string version_code = 2;
  string app_build = 3;
  string variant = 4;
  string installation_id = 5;
  repeated ApmNativeFrameIdentity native_frames = 6;
}

// Build-relative native frame identity; absolute process addresses are not part of the contract.
message ApmNativeFrameIdentity {
  string abi = 1;
  string module_build_id = 2;
  string module_name = 3;
  uint64 module_relative_pc = 4;
  optional uint64 load_bias = 5;
}

// Collector request schema shared by explicit V2 and V3 media types.
message ApmBatchEnvelope {
  uint32 schema_version = 1;
  string sdk_name = 2;
  string sdk_version = 3;
  string batch_id = 4;
  int64 sent_at_ms = 5;
  ApmResource resource = 6;
  repeated ApmEventMessage events = 7;
}

// Logical whole-batch ACK mirrored by X-Apm-* HTTP response headers.
message ApmBatchAck {
  uint32 schema_version = 1;
  string batch_id = 2;
  uint32 accepted_event_count = 3;
}
