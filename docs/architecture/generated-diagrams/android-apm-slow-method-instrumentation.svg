  <g filter="url(#shadow)"><rect x="70" y="245" width="250" height="180" rx="18" fill="#F8F4FC" stroke="#6D4AA5" stroke-width="3"/><rect x="70" y="245" width="10" height="180" rx="5" fill="#6D4AA5"/><text x="94" y="287" class="node-title" fill="#6D4AA5">宿主 Gradle 配置</text><text x="94" y="327" class="body">应用 apm-plugin</text><text x="94" y="355" class="body">包过滤</text><text x="94" y="383" class="body">阈值与开关</text><rect x="385" y="245" width="250" height="180" rx="18" fill="#F4F8FC" stroke="#1F5A94" stroke-width="3"/><rect x="385" y="245" width="10" height="180" rx="5" fill="#1F5A94"/><text x="409" y="287" class="node-title" fill="#1F5A94">AGP Instrumentation</text><text x="409" y="327" class="body">ClassVisitor</text><text x="409" y="355" class="body">MethodVisitor</text><text x="409" y="383" class="body">现代 instrumentation API</text><rect x="700" y="245" width="250" height="180" rx="18" fill="#F0FAF7" stroke="#157A6E" stroke-width="3"/><rect x="700" y="245" width="10" height="180" rx="5" fill="#157A6E"/><text x="724" y="287" class="node-title" fill="#157A6E">插桩后字节码</text><text x="724" y="327" class="body">方法入口计时</text><text x="724" y="355" class="body">正常/异常出口</text><text x="724" y="383" class="body">保持原行为</text><rect x="1015" y="245" width="250" height="180" rx="18" fill="#FFF8F1" stroke="#B25D16" stroke-width="3"/><rect x="1015" y="245" width="10" height="180" rx="5" fill="#B25D16"/><text x="1039" y="287" class="node-title" fill="#B25D16">运行时计时</text><text x="1039" y="327" class="body">阈值判断</text><text x="1039" y="355" class="body">线程/方法信息</text><text x="1039" y="383" class="body">慢方法事件</text><rect x="1330" y="245" width="210" height="180" rx="18" fill="#F4F8FC" stroke="#1F5A94" stroke-width="3"/><rect x="1330" y="245" width="10" height="180" rx="5" fill="#1F5A94"/><text x="1354" y="287" class="node-title" fill="#1F5A94">事件管线</text><text x="1354" y="327" class="body">Apm</text><text x="1354" y="355" class="body">Dispatcher</text><text x="1354" y="383" class="body">outbox</text><line x1="320" y1="335" x2="385" y2="335" stroke="#52657A" stroke-width="4" marker-end="url(#arrow)"/><rect x="280.5" y="309.0" width="144" height="30" rx="9" fill="#FFFFFF" opacity="0.94"/><text x="352.5" y="330.0" class="label" text-anchor="middle">配置</text><line x1="635" y1="335" x2="700" y2="335" stroke="#52657A" stroke-width="4" marker-end="url(#arrow)"/><rect x="595.5" y="309.0" width="144" height="30" rx="9" fill="#FFFFFF" opacity="0.94"/><text x="667.5" y="330.0" class="label" text-anchor="middle">访问</text><line x1="950" y1="335" x2="1015" y2="335" stroke="#52657A" stroke-width="4" marker-end="url(#arrow)"/><rect x="910.5" y="309.0" width="144" height="30" rx="9" fill="#FFFFFF" opacity="0.94"/><text x="982.5" y="330.0" class="label" text-anchor="middle">执行</text><line x1="1265" y1="335" x2="1330" y2="335" stroke="#52657A" stroke-width="4" marker-end="url(#arrow)"/><rect x="1225.5" y="309.0" width="144" height="30" rx="9" fill="#FFFFFF" opacity="0.94"/><text x="1297.5" y="330.0" class="label" text-anchor="middle">上报</text><rect x="385" y="560" width="565" height="120" rx="18" fill="#F8F4FC" stroke="#6D4AA5" stroke-width="3"/><rect x="385" y="560" width="10" height="120" rx="5" fill="#6D4AA5"/><text x="409" y="602" class="node-title" fill="#6D4AA5">构建期</text><text x="409" y="642" class="body">只处理匹配类；插件未应用则不插桩</text><rect x="1015" y="560" width="525" height="120" rx="18" fill="#FFF8F1" stroke="#B25D16" stroke-width="3"/><rect x="1015" y="560" width="10" height="120" rx="5" fill="#B25D16"/><text x="1039" y="602" class="node-title" fill="#B25D16">运行期</text><text x="1039" y="642" class="body">超过阈值才形成事件；仍受采样与配置约束</text><rect x="70" y="770" width="356" height="38" rx="19" fill="#1F5A94" opacity="0.12"/><text x="248.0" y="795" text-anchor="middle" class="pill" fill="#1F5A94">非 legacy Transform</text><rect x="390" y="770" width="150" height="38" rx="19" fill="#9B5C17" opacity="0.12"/><text x="465.0" y="795" text-anchor="middle" class="pill" fill="#9B5C1