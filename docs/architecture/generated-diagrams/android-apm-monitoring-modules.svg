<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFE"/>
      <stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#12355B" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#52657A"/>
    </marker>
    <style>
      .title { font: 700 38px 'Microsoft YaHei', Arial, sans-serif; fill: #12355B; }
      .subtitle { font: 400 20px 'Microsoft YaHei', Arial, sans-serif; fill: #52657A; }
      .node-title { font: 700 23px 'Microsoft YaHei', Arial, sans-serif; }
      .body { font: 400 18px 'Microsoft YaHei', Arial, sans-serif; fill: #2F4052; }
      .label { font: 600 16px 'Microsoft YaHei', Arial, sans-serif; fill: #40556B; }
      .pill { font: 600 16px 'Microsoft YaHei', Arial, sans-serif; }
      .boundary { font: 700 18px 'Microsoft YaHei', Arial, sans-serif; fill: #9B5C17; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <text x="70" y="70" class="title">AndroidAPM 监控模块</text>
  <text x="70" y="108" class="subtitle">按真实接入方式分组，而非按营销口径分组</text>
  <g filter="url(#shadow)"><rect x="70" y="170" width="450" height="480" rx="18" fill="#F0FAF7" stroke="#157A6E" stroke-width="3"/><rect x="70" y="170" width="10" height="480" rx="5" fill="#157A6E"/><text x="94" y="212" class="node-title" fill="#157A6E">自动生命周期 / 系统采集</text><text x="94" y="252" class="body">apm-memory · apm-crash</text><text x="94" y="280" class="body">apm-anr · apm-launch</text><text x="94" y="308" class="body">apm-cpu · apm-fps</text><text x="94" y="336" class="body">apm-jank · apm-exit-reason</text><text x="94" y="364" class="body"></text><text x="94" y="392" class="body">初始化后可运行</text><text x="94" y="420" class="body">仍受 API / 权限 / OEM 限制</text><rect x="575" y="170" width="450" height="480" rx="18" fill="#F4F8FC" stroke="#1F5A94" stroke-width="3"/><rect x="575" y="170" width="10" height="480" rx="5" fill="#1F5A94"/><text x="599" y="212" class="node-title" fill="#1F5A94">宿主显式 API 接入</text><text x="599" y="252" class="body">apm-network · apm-database</text><text x="599" y="280" class="body">apm-ipc · apm-webview</text><text x="599" y="308" class="body">apm-battery · apm-io</text><text x="599" y="336" class="body"></text><text x="599" y="364" class="body">宿主传入真实调用点数据</text><text x="599" y="392" class="body">不等于全局自动 Hook</text><text x="599" y="420" class="body">不等于零侵入</text><rect x="1080" y="170" width="450" height="230" rx="18" fill="#F8F4FC" stroke="#6D4AA5" stroke-width="3"/><rect x="1080" y="170" width="10" height="230" rx="5" fill="#6D4AA5"/><text x="1104" y="212" class="node-title" fill="#6D4AA5">构建期插桩</text><text x="1104" y="252" class="body">apm-slow-method</text><text x="1104" y="280" class="body">apm-plugin</text><text x="1104" y="308" class="body"></text><text x="1104" y="336" class="body">需显式应用 Gradle 插件</text><rect x="1080" y="445" width="450" height="205" rx="18" fill="#FFF8F1" stroke="#B25D16" stroke-width="3"/><rect x="1080" y="445" width="10" height="205" rx="5" fill="#B25D16"/><text x="1104" y="487" class="node-title" fill="#B25D16">扩展模块</text><text x="1104" y="527" class="body">apm-trace</text><text x="1104" y="555" class="body">apm-otel-exporter</text><text x="1104" y="583" class="body">进程内 span / 事件映射</text><rect x="70" y="750" width="212" height="38" rx="19" fill="#9B5C17" opacity="0.12"/><text x="176.0" y="775" text-anchor="middle" class="pill" fill="#9B5C17">配置字段不是能力证明</text><rect x="410" y="750" width="212" height="38" rx="19" fill="#1F5A94" opacity="0.12"/><text x="516.0" y="775" text-anchor="middle" class="pill" fill="#1F5A94">以代码路径和测试为准</text></g>
  <text x="1530" y="865" text-anchor="end" class="subtitle">AndroidAPM · 2026-07-10</text>
</svg>